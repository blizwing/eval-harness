# Day 24 — hand-crafted requirements aimed at each of judge_v2.txt's three
# verdict buckets (good / borderline / bad), to check whether "borderline"
# is actually reachable or structurally dead (Day 14/17 finding: never hit
# once across 35 real rows and 34/35 valid Day 9 outputs).
#
# judge_v2.txt's rule: field_completeness, requirement_coverage, and
# verification_fidelity are hard requirements — any one failing means
# "bad" outright. If those three pass but specificity and/or
# pass_fail_clarity fail, verdict is "borderline". All five passing is
# "good".
#
# We only control the requirement text — the actual test case is
# generated by the model (Day 7's prompt), so hitting "borderline"
# specifically means writing a requirement likely to produce a test case
# that's complete and correctly scoped, but vague on steps or on what
# counts as pass/fail. Not guaranteed on the first try, hence two
# borderline attempts from different angles.

requirements:
  # Expected: GOOD. Every checkable detail is named exactly — the state
  # transition (IN_PROGRESS -> COMPLETED), the field being set
  # (completed_at), and its exact format (ISO-8601 UTC). A generated test
  # case has nothing to be vague about: concrete precondition, concrete
  # steps, one unambiguous value to check. All 5 criteria should pass.
  - id: req_b01
    text: >
      When a technician marks a task as complete after uploading required
      photo evidence, the system must transition the task's status from
      IN_PROGRESS to COMPLETED and record completed_at as the exact UTC
      timestamp of that action in ISO-8601 format.

  # Expected: BORDERLINE (attempt 1). The state transition itself is a
  # concrete, checkable anchor (elapsed time exceeds SLA threshold ->
  # status OVERDUE), which should keep field_completeness,
  # requirement_coverage, and verification_fidelity passing. But
  # "unreasonably long", "appropriate supervisor", and "timely manner"
  # are subjective qualifiers with no exact value behind them — likely to
  # produce vague preconditions/notification steps and a fuzzy pass/fail
  # condition, failing specificity and/or pass_fail_clarity while the
  # three hard criteria hold.
  - id: req_b02
    text: >
      If a technician takes an unreasonably long time to complete an
      assigned task, the system should flag the task's status as OVERDUE
      once the elapsed time since assignment exceeds the task's
      configured SLA threshold, and notify the appropriate supervisor in
      a timely manner.

  # Expected: BORDERLINE (attempt 2, different angle). The 24-hour
  # threshold and the "no fee" outcome for the early-cancellation branch
  # are exact and checkable. But the late-cancellation branch — "a fee
  # that reasonably reflects the shortened notice given" — names no
  # formula or amount, so its expected result and pass/fail condition are
  # likely to come out vague. Risk: the model may instead judge the
  # missing formula as breaking verification_fidelity for the whole case
  # (landing on "bad" instead) — that's an acceptable outcome for a
  # second roll of the dice, not a failure of the smoke test itself.
  - id: req_b03
    text: >
      When a customer cancels a scheduled task, the system must waive the
      cancellation fee if the cancellation occurs more than 24 hours
      before the appointment window; cancellations made inside that
      window should incur a fee that reasonably reflects the shortened
      notice given.

  # Expected: BAD. No concrete action, state, field, or value is named
  # anywhere — there is nothing specific left for a generated test case
  # to verify. Should fail verification_fidelity outright (nothing exact
  # to check), and likely requirement_coverage too, since the model has
  # to invent a concrete behavior to test rather than being handed one.
  # Either failing alone is enough to force "bad" regardless of
  # specificity/pass_fail_clarity.
  - id: req_b04
    text: >
      The system should generally make sure task scheduling and
      technician assignment work well for everyone involved, avoiding
      problems and keeping things running smoothly.

  # Expected: BORDERLINE (attempt 3). req_b02/b03 missed because their
  # "soft" parts (SLA hours, fee percentage) are exactly the kind of
  # detail an LLM confidently invents a plausible default for — so the
  # generated test case ended up specific anyway. This one pairs a state
  # transition that can't be faked around (ASSIGNED -> REASSIGNED, a
  # populated handoff-note field) with a sufficiency judgment that has no
  # canonical placeholder value at all ("enough context... without
  # needing to re-contact the customer") — there's no default number or
  # format to hallucinate here, so the expected result for that part
  # should stay genuinely vague even though the state transition and
  # field presence remain concretely checkable.
  - id: req_b05
    text: >
      When a task is reassigned to a different technician mid-shift, the
      system must transition the task's status from ASSIGNED to
      REASSIGNED and require the original technician to leave a handoff
      note that gives the new technician enough context to continue the
      work without needing to re-contact the customer for basic details.
